[project]
name = "code-review-agent"
version = "0.1.0"
description = "A streaming, multi-agent source code reviewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "langchain>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2",
  "python-dotenv>=1,<2",
  "python-docx>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
